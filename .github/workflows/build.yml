name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          cache-dependency-path: app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Android signing key
        id: signing
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > keystore.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SIGNING_KEY is not configured; release APK build skipped"
          fi

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: Mexpa-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-*.apk
          archive: false

      - name: Upload Debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: Mexpa-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-*.apk
          archive: false

      - name: Upload Debug APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: Mexpa-debug-x86_64
          path: app/build/outputs/apk/debug/*-x86_64-*.apk
          archive: false

      - name: Upload Debug APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: Mexpa-debug-x86
          path: app/build/outputs/apk/debug/*-x86-*.apk
          archive: false

      - name: Upload Release APK (arm64-v8a)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Mexpa-release-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
          archive: false

      - name: Upload Release APK (armeabi-v7a)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Mexpa-release-armeabi-v7a
          path: app/build/outputs/apk/release/*-armeabi-v7a-*.apk
          archive: false

      - name: Upload Release APK (x86_64)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Mexpa-release-x86_64
          path: app/build/outputs/apk/release/*-x86_64-*.apk
          archive: false

      - name: Upload Release APK (x86)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Mexpa-release-x86
          path: app/build/outputs/apk/release/*-x86-*.apk
          archive: false

  linux-app:
    name: "Linux package: app image"
    runs-on: ubuntu-latest
    env:
      MEXPA_VERSION: "1.0.0"
      MEXPA_SKIP_ANDROID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - name: Build portable app image
        run: |
          chmod +x desktop/*.sh
          ./desktop/package-linux.sh
      - name: Upload app tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux-app-tar
          path: desktop/build/Mexpa-linux-x64-*.tar.gz
          if-no-files-found: error

  linux-deb:
    name: "Linux package: .deb"
    needs: linux-app
    runs-on: ubuntu-latest
    env:
      MEXPA_VERSION: "1.0.0"
      MEXPA_SKIP_ANDROID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download app tarball
        uses: actions/download-artifact@v7
        with:
          name: linux-app-tar
          path: desktop/build
      - name: Build .deb
        run: |
          chmod +x desktop/*.sh
          ./desktop/package-deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: desktop/build/deb-pkg/*.deb
          if-no-files-found: error

  linux-appimage:
    name: "Linux package: AppImage"
    needs: linux-app
    runs-on: ubuntu-latest
    env:
      MEXPA_VERSION: "1.0.0"
      MEXPA_SKIP_ANDROID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download app tarball
        uses: actions/download-artifact@v7
        with:
          name: linux-app-tar
          path: desktop/build
      - name: Build AppImage
        run: |
          chmod +x desktop/*.sh
          ./desktop/package-appimage.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: desktop/build/Mexpa-*-x86_64.AppImage
          if-no-files-found: error

  linux-rpm:
    name: "Linux package: .rpm"
    needs: linux-app
    runs-on: ubuntu-latest
    env:
      MEXPA_VERSION: "1.0.0"
      MEXPA_SKIP_ANDROID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download app tarball
        uses: actions/download-artifact@v7
        with:
          name: linux-app-tar
          path: desktop/build
      - name: Build .rpm in Fedora
        run: |
          chmod +x desktop/*.sh
          docker run --rm --network host -v "$PWD:$PWD" -w "$PWD" fedora:41 bash -lc '
            dnf install -y rpm-build tar gzip xz >/dev/null
            ./desktop/package-rpm.sh
          '
      - name: Upload .rpm
        uses: actions/upload-artifact@v7
        with:
          name: linux-rpm
          path: desktop/build/rpm/RPMS/**/*.rpm
          if-no-files-found: error

  linux-arch:
    name: "Linux package: Arch"
    needs: linux-app
    runs-on: ubuntu-latest
    env:
      MEXPA_VERSION: "1.0.0"
      MEXPA_SKIP_ANDROID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download app tarball
        uses: actions/download-artifact@v7
        with:
          name: linux-app-tar
          path: desktop/build
      - name: Build Arch package
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" archlinux:latest bash packaging/ci/arch-build.sh
      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: linux-arch
          path: desktop/build/arch-pkg/*.pkg.tar.*
          if-no-files-found: error

  windows-package:
    name: "Windows package: portable + EXE"
    runs-on: windows-latest
    env:
      MEXPA_SKIP_ANDROID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - name: Install WiX Toolset for jpackage installers
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory | Select-Object -First 1
            if (-not $wix) { throw 'WiX Toolset bin not found after install' }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName 'bin')
          }
      - name: Build portable + EXE
        shell: pwsh
        run: ./desktop/package-windows.ps1 -Installer
      - name: Upload Windows portable
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: desktop/build/Mexpa-windows-x64-*.zip
          if-no-files-found: error
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
