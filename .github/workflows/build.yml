name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          cache-dependency-path: app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Android signing key
        id: signing
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > keystore.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SIGNING_KEY is not configured; release APK build skipped"
          fi

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-*.apk
          archive: false

      - name: Upload Debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-*.apk
          archive: false

      - name: Upload Debug APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-x86_64
          path: app/build/outputs/apk/debug/*-x86_64-*.apk
          archive: false

      - name: Upload Debug APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-x86
          path: app/build/outputs/apk/debug/*-x86-*.apk
          archive: false

      - name: Upload Release APK (arm64-v8a)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
          archive: false

      - name: Upload Release APK (armeabi-v7a)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-armeabi-v7a
          path: app/build/outputs/apk/release/*-armeabi-v7a-*.apk
          archive: false

      - name: Upload Release APK (x86_64)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-x86_64
          path: app/build/outputs/apk/release/*-x86_64-*.apk
          archive: false

      - name: Upload Release APK (x86)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-x86
          path: app/build/outputs/apk/release/*-x86-*.apk
          archive: false
