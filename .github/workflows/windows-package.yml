name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build portable + EXE
    runs-on: windows-latest
    env:
      MEXPA_SKIP_ANDROID: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install WiX Toolset for jpackage installers
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory | Select-Object -First 1
            if (-not $wix) { throw 'WiX Toolset bin not found after install' }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName 'bin')
          }
      - name: Build portable app image
        shell: pwsh
        run: |
          ./packaging/windows/build-binaries.ps1
          ./gradlew.bat :desktop:createDistributable
          $app = Get-ChildItem desktop/build/compose/binaries/main/app -Directory |
            Where-Object { $_.Name -ieq 'mexpa' } | Select-Object -First 1
          if (-not $app) { throw 'app image not found' }
          # Windows jpackage launcher is at the app root; mihomo.exe must sit beside it.
          Copy-Item desktop/build/windows-bin/mihomo.exe $app.FullName -Force
          Copy-Item desktop/build/windows-bin/mexpa-transform.exe $app.FullName -Force
          Copy-Item desktop/build/windows-bin/wintun.dll $app.FullName -Force
          Copy-Item packaging/windows/wintun-LICENSE.txt (Join-Path $app.FullName 'wintun-LICENSE.txt') -Force
          Remove-Item desktop/build/Mexpa-windows-x64.zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $app.FullName '*') -DestinationPath desktop/build/Mexpa-windows-x64.zip
      - name: Build EXE installer
        shell: pwsh
        run: ./gradlew.bat :desktop:packageExe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: desktop/build/Mexpa-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
